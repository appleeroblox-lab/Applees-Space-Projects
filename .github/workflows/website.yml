name: Update Roblox Stats and Publish Website

on:
  push:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website and Roblox statistics
        shell: python
        run: |
          import json
          import shutil
          import urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          output = Path("_site")
          output.mkdir(exist_ok=True)

          # Copy the website's existing files.
          for name in [
              "index.html",
              "images",
              "css",
              "js",
              "assets",
              "CNAME",
              "favicon.ico",
              "robots.txt",
              "sitemap.xml",
          ]:
              source = Path(name)

              if not source.exists():
                  continue

              destination = output / name

              if source.is_dir():
                  shutil.copytree(source, destination, dirs_exist_ok=True)
              else:
                  shutil.copy2(source, destination)

          if not (output / "index.html").exists():
              raise RuntimeError("index.html is missing")

          place_ids = [
              "135329454168418",
              "103215463627191",
              "132650472829217",
          ]

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "Applee-Website-Stats",
                  },
              )

              with urllib.request.urlopen(request, timeout=15) as response:
                  return json.load(response)

          def valid_count(value):
              return type(value) is int and value >= 0

          games = []

          # Resolve actual Universe IDs from the Place IDs.
          for place_id in place_ids:
              try:
                  result = get_json(
                      f"https://apis.roblox.com/universes/v1/places/{place_id}/universe"
                  )

                  universe_id = result.get("universeId")

                  if not valid_count(universe_id) or universe_id == 0:
                      raise ValueError("Invalid Universe ID")

                  games.append({
                      "placeId": place_id,
                      "universeId": universe_id,
                      "playing": None,
                      "visits": None,
                      "upVotes": None,
                      "downVotes": None,
                  })

              except Exception as error:
                  print(f"::warning::Place {place_id}: {error}")

          if games:
              ids = ",".join(str(game["universeId"]) for game in games)

              endpoints = [
                  (
                      f"https://games.roblox.com/v1/games?universeIds={ids}",
                      ["playing", "visits"],
                  ),
                  (
                      f"https://games.roblox.com/v1/games/votes?universeIds={ids}",
                      ["upVotes", "downVotes"],
                  ),
              ]

              for url, fields in endpoints:
                  try:
                      result = get_json(url)
                      records = {
                          item["id"]: item
                          for item in result.get("data", [])
                      }

                      for game in games:
                          record = records.get(game["universeId"], {})

                          for field in fields:
                              value = record.get(field)

                              if valid_count(value):
                                  game[field] = value

                  except Exception as error:
                      print(f"::warning::Roblox statistics: {error}")

          snapshot = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "games": games,
          }

          (output / "stats.json").write_text(
              json.dumps(snapshot, indent=2),
              encoding="utf-8",
          )

          print("Website and stats.json are ready")

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
